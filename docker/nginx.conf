# Serves the Vue SPA and proxies /api/ to the api container.

# Cache-Control per path, so every add_header lives at server level and is inherited by all
# locations (a location with its own add_header would drop the server-level headers).
# Empty value = header not added (API responses keep their own caching).
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";  # Vite content-hashed files
    ~^/api/    "";
    default    "no-cache";                             # index.html and SPA routes
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker DNS; resolving per request keeps the proxy working when the api container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # No URI part in proxy_pass, so the /api prefix is passed through unchanged.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Vite emits content-hashed file names under /assets/.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
