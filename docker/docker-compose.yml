# Run from the repo root:
#   docker compose -f docker/docker-compose.yml up -d --build
# Values come from docker/.env (copy docker/.env.example; never commit .env).
name: kuka-middleware

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      WEB_UI_API_KEY: ${WEB_UI_API_KEY:?run docker/start.bat to configure API keys}
      NGINX_ENVSUBST_FILTER: "^WEB_UI_API_KEY$$"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApiKeys__WebUi: ${WEB_UI_API_KEY:?run docker/start.bat to configure API keys}
      ApiKeys__ExternalSystem: ${EXTERNAL_SYSTEM_API_KEY:?run docker/start.bat to configure API keys}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in docker/.env};Username=${POSTGRES_USER:?set POSTGRES_USER in docker/.env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env};Gss Encryption Mode=Disable"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      # PostgreSQL 18+ images: PGDATA=/var/lib/postgresql/18/docker, VOLUME /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seq:
    image: datalust/seq:2026.1.17182
    environment:
      ACCEPT_EULA: "Y"
      # Local single-user log viewer, published on 127.0.0.1 only.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Host port -> UI and API (80). Containers ingest via http://seq:5341 (ingestion-only port).
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  seq-data:
