# Azure Pipelines CI (kuka-middleware-ci) for the GitHub repository.
# Runs on a self-hosted Windows agent (Windows service as Local System, Windows PowerShell 5.1).
# The agent workspace is reused between runs, so checkout cleans it.
# Both jobs target the same agent and therefore run sequentially.
# Builds of pull requests from forks must be disabled in Azure DevOps (code runs as SYSTEM); see README.
# No secret variables or live services required.
#
# Required pipeline variables (defined in Azure DevOps, not in this file):
#   AgentPoolName  agent pool of the self-hosted agent, e.g. Default
#   AgentName      name of the self-hosted agent, e.g. jozef-agent
trigger:
  batch: true
  branches:
    include:
      - '*'

pr:
  autoCancel: true
  branches:
    include:
      - main

pool:
  name: $(AgentPoolName)
  demands:
    - Agent.Name -equals $(AgentName)

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_UI_LANGUAGE: 'en'
  CI: 'true'

jobs:
  - job: Backend
    displayName: Backend build and tests
    timeoutInMinutes: 20
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - task: UseDotNet@2
        displayName: Install pinned .NET SDK
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: '$(Build.SourcesDirectory)/backend'

      - powershell: dotnet restore
        displayName: Restore backend packages
        workingDirectory: '$(Build.SourcesDirectory)/backend'

      # Restore already fails on NuGetAudit warnings (TreatWarningsAsErrors in Directory.Build.props);
      # this step is a second safeguard and prints the advisory table.
      # dotnet list exits with 0 even when it finds vulnerable packages, so its output is checked too.
      - powershell: |
          $output = dotnet list package --vulnerable --include-transitive | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed with exit code $LASTEXITCODE." }
          if ($output -match 'has the following vulnerable packages') { throw 'Vulnerable backend packages found.' }
        displayName: Check backend packages for known vulnerabilities
        workingDirectory: '$(Build.SourcesDirectory)/backend'

      - powershell: dotnet build --configuration Release --no-restore -warnaserror -p:EnableNETAnalyzers=true
        displayName: Build backend with analyzers and warnings as errors
        workingDirectory: '$(Build.SourcesDirectory)/backend'

      - powershell: >-
          dotnet test --configuration Release --no-build --no-restore
          --results-directory "$env:COMMON_TESTRESULTSDIRECTORY\backend"
          --report-xunit-xml --report-xunit-xml-filename backend.xml
        displayName: Run backend unit tests
        workingDirectory: '$(Build.SourcesDirectory)/backend'

      - task: PublishTestResults@2
        displayName: Publish backend test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: XUnit
          testResultsFiles: '$(Common.TestResultsDirectory)/backend/backend.xml'
          testRunTitle: Backend unit tests
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          failTaskOnFailureToPublishResults: true

  - job: Frontend
    displayName: Frontend checks and tests
    timeoutInMinutes: 20
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - task: UseNode@1
        displayName: Install Node.js 24
        inputs:
          version: '24.22.1'

      - powershell: npm ci --no-audit --no-fund
        displayName: Install locked frontend packages
        workingDirectory: '$(Build.SourcesDirectory)/frontend'

      - powershell: npm audit --omit=dev --audit-level=high
        displayName: Audit runtime frontend packages
        workingDirectory: '$(Build.SourcesDirectory)/frontend'

      - powershell: npm run typecheck
        displayName: Check frontend types
        workingDirectory: '$(Build.SourcesDirectory)/frontend'

      - powershell: npm run lint
        displayName: Lint frontend
        workingDirectory: '$(Build.SourcesDirectory)/frontend'

      # '--' is quoted: unquoted, PowerShell consumes it before npm.ps1 and npm swallows the Vitest flags.
      - powershell: >-
          npm run test '--' --reporter=default --reporter=junit
          --outputFile "$env:COMMON_TESTRESULTSDIRECTORY\frontend.xml"
        displayName: Run frontend unit tests
        workingDirectory: '$(Build.SourcesDirectory)/frontend'

      - task: PublishTestResults@2
        displayName: Publish frontend test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '$(Common.TestResultsDirectory)/frontend.xml'
          testRunTitle: Frontend unit tests
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          failTaskOnFailureToPublishResults: true

      - powershell: npm run build
        displayName: Build frontend for production
        workingDirectory: '$(Build.SourcesDirectory)/frontend'
